name: Documentation agent PoC

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira documentation task key
        required: true
        type: string
      issue_summary:
        description: Jira task summary
        required: true
        type: string
      issue_description:
        description: Jira task description and evidence
        required: true
        type: string

concurrency:
  group: documentation-agent-poc-${{ inputs.issue_key }}
  cancel-in-progress: false

jobs:
  prepare-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Capture trusted main SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ ! "${base_sha}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "Checkout produced an invalid commit SHA" >&2
            exit 1
          fi
          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Validate and serialize ticket inputs
        id: ticket
        env:
          ISSUE_KEY: ${{ inputs.issue_key }}
          ISSUE_SUMMARY: ${{ inputs.issue_summary }}
          ISSUE_DESCRIPTION: ${{ inputs.issue_description }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          issue_key = os.environ["ISSUE_KEY"]
          issue_summary = os.environ["ISSUE_SUMMARY"]
          issue_description = os.environ["ISSUE_DESCRIPTION"]

          errors = []
          if not re.fullmatch(r"[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)*-[1-9][0-9]*", issue_key):
              errors.append(
                  "issue_key must contain uppercase Jira-style segments and end in a number"
              )
          if not 3 <= len(issue_key) <= 64:
              errors.append("issue_key must contain between 3 and 64 characters")
          if not 1 <= len(issue_summary) <= 200:
              errors.append("issue_summary must contain between 1 and 200 characters")
          if not issue_summary.strip():
              errors.append("issue_summary must not be blank")
          if any(ord(character) < 32 for character in issue_summary):
              errors.append("issue_summary must not contain control characters")
          if not 1 <= len(issue_description) <= 20_000:
              errors.append(
                  "issue_description must contain between 1 and 20000 characters"
              )
          if not issue_description.strip():
              errors.append("issue_description must not be blank")
          if any(
              ord(character) < 32 and character not in "\r\n\t"
              for character in issue_description
          ):
              errors.append(
                  "issue_description contains an unsupported control character"
              )

          if errors:
              raise SystemExit("Invalid workflow inputs:\n- " + "\n- ".join(errors))

          ticket = {
              "issue_key": issue_key,
              "issue_summary": issue_summary,
              "issue_description": issue_description,
          }
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          ticket_path = runner_temp / "documentation-ticket.json"
          ticket_path.write_text(
              json.dumps(ticket, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8", newline="\n"
          ) as output:
              output.write(f"issue_key={issue_key}\n")
          PY

      - name: Run validator tests before exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_*.py' \
            -v

      - name: Stage trusted automation scripts and prompt
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:.github/scripts/generate-documentation-proposal.py" \
            > "${RUNNER_TEMP}/generate-documentation-proposal.py"
          git show "${BASE_SHA}:.github/prompts/documentation-agent-poc.md" \
            > "${RUNNER_TEMP}/documentation-agent-poc.md"
          git show "${BASE_SHA}:.github/scripts/prepare-documentation-pull-request.py" \
            > "${RUNNER_TEMP}/prepare-documentation-pull-request.py"
          git show "${BASE_SHA}:.github/scripts/notify-jira-documentation-abstention.py" \
            > "${RUNNER_TEMP}/notify-jira-documentation-abstention.py"
          git show "${BASE_SHA}:.github/scripts/notify-slack-documentation-pr.py" \
            > "${RUNNER_TEMP}/notify-slack-documentation-pr.py"

      - name: Generate documentation proposal with Gemini
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/generate-documentation-proposal.py" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --ticket-file "${RUNNER_TEMP}/documentation-ticket.json" \
            --prompt-file "${RUNNER_TEMP}/documentation-agent-poc.md" \
            --agent-report "${RUNNER_TEMP}/agent-report.md"\
            --timeout 300

      - name: Ensure an agent report exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "agent-report.md"
          if not report.exists():
              report.write_text(
                  "Decisión: error\n"
                  "Documento: ninguno\n"
                  "Evidencia: Gemini did not produce a final report\n"
                  "Texto anterior: no aplica\n"
                  "Texto propuesto: no aplica\n"
                  "Motivo: la ejecución de Gemini no produjo un informe\n",
                  encoding="utf-8",
              )
          PY

      - name: Validate the generated proposal
        id: validation
        if: always()
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "validation-result.json"
          output.write_text(
              json.dumps(
                  {
                      "valid": False,
                      "decision": "error",
                      "base_sha": os.environ["BASE_SHA"],
                      "changed_files": [],
                      "errors": [
                          "The deterministic validator did not complete successfully"
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          current_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "${current_sha}" != "${BASE_SHA}" ]; then
            echo "HEAD changed after checkout: expected ${BASE_SHA}, got ${current_sha}" >&2
            exit 1
          fi

          validator_path="${RUNNER_TEMP}/validate-documentation-proposal.py"
          if ! git show "${BASE_SHA}:.github/scripts/validate-documentation-proposal.py" \
            > "${validator_path}"; then
            echo "Could not load the trusted validator from ${BASE_SHA}" >&2
            exit 1
          fi

          python "${validator_path}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-sha "${BASE_SHA}" \
            --agent-report "${RUNNER_TEMP}/agent-report.md" \
            --output "${RUNNER_TEMP}/validation-result.json"

      - name: Capture generated diff
        if: always()
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          git diff --binary "${BASE_SHA}" -- \
            > "${RUNNER_TEMP}/documentation-proposal.diff"

      - name: Upload proposal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-agent-poc-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/documentation-proposal.diff
            ${{ runner.temp }}/agent-report.md
            ${{ runner.temp }}/validation-result.json

      - name: Enforce Gemini and validation results
        if: always()
        env:
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GEMINI_OUTCOME:-missing}" != "success" ]; then
            echo "Gemini proposal generation failed with outcome ${GEMINI_OUTCOME:-missing}" >&2
            exit 1
          fi
          if [ "${VALIDATION_OUTCOME:-missing}" != "success" ]; then
            echo "The deterministic proposal validator rejected the change" >&2
            exit 1
          fi

      - name: Prepare validated pull request publication
        id: publication
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/prepare-documentation-pull-request.py" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --validation-result "${RUNNER_TEMP}/validation-result.json" \
            --ticket-file "${RUNNER_TEMP}/documentation-ticket.json" \
            --agent-report "${RUNNER_TEMP}/agent-report.md" \
            --body-file "${RUNNER_TEMP}/pull-request-body.md" \
            --github-output "${GITHUB_OUTPUT}" \
            --base-sha "${BASE_SHA}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --repository "${REPOSITORY}" \
            --server-url "${SERVER_URL}"

      - name: Prepare Jira abstention notification
        id: jira_notification_plan
        if: steps.publication.outputs.decision == 'abstention'
        env:
          EXPECTED_ISSUE_KEY: ${{ steps.ticket.outputs.issue_key }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/notify-jira-documentation-abstention.py" prepare \
            --validation-result "${RUNNER_TEMP}/validation-result.json" \
            --ticket-file "${RUNNER_TEMP}/documentation-ticket.json" \
            --agent-report "${RUNNER_TEMP}/agent-report.md" \
            --payload-file "${RUNNER_TEMP}/jira-abstention-payload.json" \
            --github-output "${GITHUB_OUTPUT}" \
            --expected-issue-key "${EXPECTED_ISSUE_KEY}" \
            --server-url "${SERVER_URL}" \
            --repository "${REPOSITORY}" \
            --run-id "${RUN_ID}"

      - name: Notify Jira of valid documentation abstention
        id: jira_notification
        if: steps.jira_notification_plan.outputs.notify == 'true'
        continue-on-error: true
        env:
          JIRA_AUTOMATION_WEBHOOK_URL: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_URL }}
          JIRA_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.JIRA_AUTOMATION_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python "${RUNNER_TEMP}/notify-jira-documentation-abstention.py" send \
            --payload-file "${RUNNER_TEMP}/jira-abstention-payload.json" \
            --timeout 30

      - name: Publish validated documentation pull request
        id: pull_request
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROMPT_DISABLED: "1"
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: ${{ steps.publication.outputs.branch }}
          DOCUMENT: ${{ steps.publication.outputs.document }}
          COMMIT_MESSAGE: ${{ steps.publication.outputs.commit_message }}
          PR_TITLE: ${{ steps.publication.outputs.pr_title }}
          PR_BODY: ${{ steps.publication.outputs.pr_body }}
          ISSUE_KEY: ${{ steps.ticket.outputs.issue_key }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr list --state open --head "${BRANCH}" --limit 100 \
            --json url,title,headRefName \
            > "${RUNNER_TEMP}/open-prs-for-branch.json"
          gh pr list --state open --search "${ISSUE_KEY} in:title" --limit 1000 \
            --json url,title,headRefName \
            > "${RUNNER_TEMP}/open-prs-for-ticket.json"
          existing_pr_url="$(python \
            "${RUNNER_TEMP}/notify-slack-documentation-pr.py" find-pr \
            --candidates-file \
              "${RUNNER_TEMP}/open-prs-for-branch.json" \
              "${RUNNER_TEMP}/open-prs-for-ticket.json" \
            --branch "${BRANCH}" \
            --issue-key "${ISSUE_KEY}" \
            --repository "${REPOSITORY}")"
          if [ -n "${existing_pr_url}" ]; then
            printf 'pr_url=%s\ncreated=false\n' "${existing_pr_url}" \
              >> "${GITHUB_OUTPUT}"
            printf 'Open pull request reused: [%s](%s)\n' \
              "${existing_pr_url}" "${existing_pr_url}" \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          current_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [ "${current_sha}" != "${BASE_SHA}" ]; then
            echo "HEAD changed before publication: expected ${BASE_SHA}, got ${current_sha}" >&2
            exit 1
          fi
          git diff --check "${BASE_SHA}" --

          git config --local user.name "github-actions[bot]"
          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${BRANCH}" "${BASE_SHA}"
          git add -- "${DOCUMENT}"

          mapfile -d '' staged_files < <(git diff --cached --name-only -z --)
          if [ "${#staged_files[@]}" -ne 1 ] || \
             [ "${staged_files[0]:-}" != "${DOCUMENT}" ]; then
            echo "The staged change does not match the validated Markdown" >&2
            exit 1
          fi
          staged_status="$(git diff --cached --name-status --no-renames -- "${DOCUMENT}")"
          if [ "${staged_status}" != $'M\t'"${DOCUMENT}" ]; then
            echo "The staged Markdown is not a simple modification" >&2
            exit 1
          fi
          git diff --cached --check
          if ! git diff --quiet --; then
            echo "Unstaged tracked changes remain after staging the validated Markdown" >&2
            exit 1
          fi
          git commit -m "${COMMIT_MESSAGE}" -- "${DOCUMENT}"

          askpass_path="${RUNNER_TEMP}/git-askpass.sh"
          python - "${askpass_path}" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          path.write_text(
              "#!/bin/sh\n"
              "case \"$1\" in\n"
              "  *Username*) printf '%s\\n' 'x-access-token' ;;\n"
              "  *Password*) printf '%s\\n' \"$GH_TOKEN\" ;;\n"
              "  *) exit 1 ;;\n"
              "esac\n",
              encoding="utf-8",
              newline="\n",
          )
          os.chmod(path, 0o700)
          PY
          export GIT_ASKPASS="${askpass_path}"
          export GIT_ASKPASS_REQUIRE=force
          export GIT_TERMINAL_PROMPT=0
          git push --set-upstream origin "HEAD:refs/heads/${BRANCH}"

          set +e
          pr_url="$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file "${PR_BODY}")"
          pr_status=$?
          set -e
          if [ "${pr_status}" -ne 0 ] || [ -z "${pr_url}" ]; then
            echo "::error title=Pull request creation failed::The branch ${BRANCH} was pushed successfully but no pull request was created. The branch was not deleted."
            printf 'Publication failed after pushing branch `%s`. No automatic deletion was attempted.\n' \
              "${BRANCH}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          confirmed_pr_url="$(gh pr view "${pr_url}" --json url --jq '.url')"
          if [ -z "${confirmed_pr_url}" ]; then
            echo "::error title=Pull request confirmation failed::GitHub did not confirm the newly created pull request URL."
            exit 1
          fi

          printf 'pr_url=%s\ncreated=true\n' "${confirmed_pr_url}" \
            >> "${GITHUB_OUTPUT}"

          printf 'Pull request created: [%s](%s)\n' \
            "${confirmed_pr_url}" "${confirmed_pr_url}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Slack of new documentation pull request
        if: steps.pull_request.outputs.created == 'true'
        continue-on-error: true
        env:
          SLACK_DOCUMENTATION_WEBHOOK_URL: ${{ secrets.SLACK_DOCUMENTATION_WEBHOOK_URL }}
          ISSUE_KEY: ${{ steps.ticket.outputs.issue_key }}
          ISSUE_SUMMARY: ${{ inputs.issue_summary }}
          DOCUMENT: ${{ steps.publication.outputs.document }}
          PREVIOUS_VERSION: ${{ steps.publication.outputs.previous_version }}
          PROPOSED_VERSION: ${{ steps.publication.outputs.proposed_version }}
          PR_URL: ${{ steps.pull_request.outputs.pr_url }}
        shell: bash
        run: |
          python "${RUNNER_TEMP}/notify-slack-documentation-pr.py" send \
            --issue-key "${ISSUE_KEY}" \
            --issue-summary "${ISSUE_SUMMARY}" \
            --document "${DOCUMENT}" \
            --previous-version "${PREVIOUS_VERSION}" \
            --proposed-version "${PROPOSED_VERSION}" \
            --pr-url "${PR_URL}" \
            --timeout 15

      - name: Enforce Jira abstention notification result
        if: always()
        env:
          NOTIFICATION_REQUIRED: ${{ steps.jira_notification_plan.outputs.notify }}
          NOTIFICATION_OUTCOME: ${{ steps.jira_notification.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${NOTIFICATION_REQUIRED:-false}" = "true" ] && \
             [ "${NOTIFICATION_OUTCOME:-missing}" != "success" ]; then
            echo "Jira abstention notification failed" >&2
            exit 1
          fi
