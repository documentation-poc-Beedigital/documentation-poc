name: Update documentation preview links

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Documentation PR number to reconcile
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: document-preview-${{ github.event.issue.number || github.event.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.id == 73139402 &&
       github.event.comment.performed_via_github_app.id == 85455)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Privileged job: only default-branch code, never checkout a PR head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile Cloudflare preview for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B .github/scripts/update-document-preview-links.py
